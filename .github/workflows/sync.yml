# Upstream sync bot.
# Daily (and on demand): look up the latest Metrolist release. If it is newer than UPSTREAM_TAG,
# rebuild the fork on top of it (clean upstream + overlay + hooks), run the engine tests and the
# evaluator gate, sign, publish a GitHub release with the APK and record the new tag.
# Anything that breaks (hook anchor gone, compile error, test/metric regression) fails the run
# and opens (or updates) an issue labelled "sync-failure".
name: Upstream sync
on:
  schedule:
    - cron: "17 3 * * *"   # 06:17 Israel time
  workflow_dispatch:
    inputs:
      force_release:
        description: Build and publish a release even if upstream did not change
        type: boolean
        default: false
      build_number:
        description: Override the build number (4th version part, e.g. 7 -> 13.7.0.7). Empty = this run's number. Must be higher than the last release's.
        type: string
        default: ""
permissions:
  contents: write
  issues: write
concurrency:
  group: upstream-sync
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.c.outputs.latest }}
      current: ${{ steps.c.outputs.current }}
      build: ${{ steps.c.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh api repos/MetrolistGroup/Metrolist/releases/latest --jq .tag_name)
          CURRENT=$(tr -d '[:space:]' < UPSTREAM_TAG)
          [ -n "$LATEST" ] || { echo "::error::could not read the latest upstream release"; exit 1; }
          BUILD=false
          if [ "$LATEST" != "$CURRENT" ] || [ "${{ inputs.force_release }}" = "true" ]; then BUILD=true; fi
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"; echo "current=$CURRENT" >> "$GITHUB_OUTPUT"; echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "upstream latest: $LATEST · synced: $CURRENT · build: $BUILD" | tee -a "$GITHUB_STEP_SUMMARY"
  engine:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/engine-check
  release:
    needs: [check, engine]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Build on upstream ${{ needs.check.outputs.latest }}
        id: apk
        uses: ./.github/actions/build-apk
        with:
          upstream-tag: ${{ needs.check.outputs.latest }}
          build-number: ${{ inputs.build_number != '' && inputs.build_number || github.run_number }}
          keystore: ${{ secrets.KEYSTORE }}
          keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.KEY_ALIAS }}
          key-password: ${{ secrets.KEY_PASSWORD }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UP="${{ needs.check.outputs.latest }}"
          V="${{ steps.apk.outputs.base-version }}"
          cat > notes.md <<EOF
          **Metrolist Discover ${{ steps.apk.outputs.version-name }}** — built on upstream Metrolist ${UP}.

          התקנה: מורידים את Metrolist-Discover.apk (או Metrolist.apk — אותו קובץ, בשם שהעדכון האוטומטי באפליקציה מחפש) ומתקינים.
          מותקן לצד Metrolist המקורית (com.metrolist.music.oz). גרסה חדשה מתקינים מעל הקודמת.

          Upstream changelog: https://github.com/MetrolistGroup/Metrolist/releases/tag/${UP}
          EOF
          # optional hand-written notes for this line of releases (e.g. the v2 experimental feature list)
          if [ -f RELEASE_NOTES.md ]; then { cat RELEASE_NOTES.md; echo; echo "---"; echo; cat notes.md; } > notes2.md && mv notes2.md notes.md; fi
          # always a normal "latest" release: the in-app updater reads /releases/latest, which skips pre-releases
          gh release create "v${V}" out/Metrolist-Discover.apk out/Metrolist.apk --title "${V}" --notes-file notes.md --latest
      - name: Record synced tag
        if: needs.check.outputs.latest != needs.check.outputs.current
        run: |
          echo "${{ needs.check.outputs.latest }}" > UPSTREAM_TAG
          git config user.name "metrolist-discover-bot"; git config user.email "bot@users.noreply.github.com"
          git commit -am "sync: upstream ${{ needs.check.outputs.latest }}" && git push
  report-failure:
    needs: [check, engine, release]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh label create sync-failure --repo "$REPO" --color B60205 --description "Upstream sync bot failed" 2>/dev/null || true
          BODY="The upstream sync bot failed while moving to Metrolist **${{ needs.check.outputs.latest }}** (synced: ${{ needs.check.outputs.current }}).
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Likely causes: a hook anchor moved (tools/apply_hooks.py), an upstream API the engine glue uses changed, or the evaluator gate caught a regression.
          The last good APK stays in Releases."
          N=$(gh issue list --repo "$REPO" --label sync-failure --state open --json number --jq '.[0].number')
          if [ -n "$N" ]; then gh issue comment "$N" --repo "$REPO" --body "$BODY"
          else gh issue create --repo "$REPO" --label sync-failure --title "Upstream sync failed (${{ needs.check.outputs.latest }})" --body "$BODY"; fi
