name: Upload release asset from artifact

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Source workflow run ID holding metrolist-discover-apk artifact
        required: true
        type: string
      tag:
        description: Release tag (e.g. v13.7.0.15)
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          name: metrolist-discover-apk
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: out
      - name: Upload Metrolist.apk and Metrolist-Discover.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh out/
          ok=0
          for attempt in 1 2 3 4 5 6; do
            gh release upload "${{ inputs.tag }}" out/Metrolist.apk --repo "${{ github.repository }}" --clobber && { ok=1; break; }
            echo "attempt ${attempt} failed; retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          [ "$ok" = "1" ]
